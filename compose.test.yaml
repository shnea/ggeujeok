name: ggeujeok-tests
services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ggeujeok_test
      POSTGRES_USER: ggeujeok_test
      POSTGRES_PASSWORD: isolated_test_only
    tmpfs: /var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U ggeujeok_test -d ggeujeok_test']
      interval: 2s
      timeout: 2s
      retries: 15
  test:
    image: ggeujeok-api:dev
    environment:
      APP_ENV: test
      SITE_URL: https://shnea.kr
      PGHOST: database
      PGDATABASE: ggeujeok_test
      PGUSER: ggeujeok_test
      PGPASSWORD: isolated_test_only
      ADMIN_OIDC_ISSUER: https://test.invalid
      ADMIN_OIDC_SUBJECT: test-admin
    depends_on:
      database:
        condition: service_healthy
    command: [sh, -c, 'node apps/api/dist/database/migrate.js && npm test && npm run test:integration --workspace @ggeujeok/api']
