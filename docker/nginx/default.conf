resolver 127.0.0.11 valid=10s ipv6=off;
upstream blog_api {
    zone blog_api 64k;
    server api:30101 resolve;
}
upstream blog_web {
    zone blog_web 64k;
    server web:3000 resolve;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 2200k;

    # OIDC callbacks contain authorization codes. Log paths without query strings.
    access_log off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location = /ads.txt {
        proxy_pass http://blog_api/api/public/settings/ads/ads.txt;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location ^~ /api/admin/uploads/ {
        client_max_body_size 4m;
        proxy_read_timeout 180s;
        proxy_pass http://blog_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location ~ ^/(api/|auth/|callback$) {
        proxy_pass http://blog_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location / {
        proxy_pass http://blog_web;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_buffering off;
    }
}
