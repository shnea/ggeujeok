# Standalone build/push file: does not require .env.prod or runtime credentials.
services:
  api:
    image: ${IMAGE_PREFIX:?IMAGE_PREFIX required}-api:${IMAGE_TAG:?IMAGE_TAG required}
    platform: ${TARGET_PLATFORM:-linux/amd64}
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: ${BUILD_TARGET:-production}
  web:
    image: ${IMAGE_PREFIX:?IMAGE_PREFIX required}-web:${IMAGE_TAG:?IMAGE_TAG required}
    platform: ${TARGET_PLATFORM:-linux/amd64}
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      target: ${BUILD_TARGET:-production}
  nginx:
    image: ${IMAGE_PREFIX:?IMAGE_PREFIX required}-nginx:${IMAGE_TAG:?IMAGE_TAG required}
    platform: ${TARGET_PLATFORM:-linux/amd64}
    build:
      context: docker/nginx
